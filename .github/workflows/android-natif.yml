# App Android native : construite ici, jamais sur un poste local.
# Chaque envoi qui touche android-natif/ lance les tests et produit une
# version de test (identifiant com.moziik.app.test), téléchargeable dans les
# artefacts de l'exécution.
name: App Android native

on:
  push:
    paths:
      - "android-natif/**"
      - ".github/workflows/android-natif.yml"
  workflow_dispatch:

concurrency:
  group: android-natif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-de-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-natif
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Tests et version de test
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: android-natif/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Version de test
        uses: actions/upload-artifact@v4
        with:
          name: moziik-test-apk
          path: android-natif/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Version publiée (com.moziik.app), signée avec la clé de l'app actuelle pour
  # s'installer comme une mise à jour. Seulement à la demande (onglet Actions,
  # « Run workflow ») : la clé arrive par les secrets du dépôt, que seul son
  # propriétaire renseigne, et n'existe en clair que le temps de la tâche.
  version-publiee:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Écrire dans les publications du dépôt (lien de téléchargement permanent).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-natif
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Clé de publication
        env:
          CLE_BASE64: ${{ secrets.MOZIIK_KEYSTORE_BASE64 }}
          MOT_DE_PASSE: ${{ secrets.MOZIIK_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.MOZIIK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$CLE_BASE64" ]; then echo "Secret MOZIIK_KEYSTORE_BASE64 absent." >&2; exit 1; fi
          echo "$CLE_BASE64" | base64 -d > "$RUNNER_TEMP/moziik-release.jks"
          # Empreintes publiques du certificat : la connexion Google (client OAuth Android) et Firebase en ont besoin.
          keytool -list -v -keystore "$RUNNER_TEMP/moziik-release.jks" -storepass "$MOT_DE_PASSE" -alias "$ALIAS" \
            | grep -E "SHA1:|SHA256:" | sed 's/^\s*/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Tests et version publiée
        env:
          MOZIIK_KEYSTORE_FILE: ${{ runner.temp }}/moziik-release.jks
          MOZIIK_KEYSTORE_PASSWORD: ${{ secrets.MOZIIK_KEYSTORE_PASSWORD }}
          MOZIIK_KEY_ALIAS: ${{ secrets.MOZIIK_KEY_ALIAS }}
          MOZIIK_KEY_PASSWORD: ${{ secrets.MOZIIK_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace testReleaseUnitTest assembleRelease bundleRelease

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/moziik-release.jks"

      - name: APK publiée
        uses: actions/upload-artifact@v4
        with:
          name: moziik-apk
          path: android-natif/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Paquet pour le Play Store
        uses: actions/upload-artifact@v4
        with:
          name: moziik-aab
          path: android-natif/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Correspondance de la réduction de code
        uses: actions/upload-artifact@v4
        with:
          name: moziik-mapping
          path: android-natif/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      # Le lien permanent : chaque version signée devient une publication du
      # dépôt (public), avec un fichier au nom constant. Ainsi
      # releases/latest/download/moziik.apk désigne toujours la dernière
      # version, se télécharge sans compte GitHub et n'expire pas, à la
      # différence des artefacts (90 jours, compte requis). L'app lit aussi
      # cette publication pour proposer la mise à jour (MiseAJour.kt).
      - name: Publication de la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "$RUNNER_TEMP/moziik.apk"
          git log -1 --format=%B | grep -v "^Co-Authored-By" > "$RUNNER_TEMP/notes.md"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$RUNNER_TEMP/moziik.apk" --clobber
          else
            gh release create "v$VERSION" "$RUNNER_TEMP/moziik.apk" --target "$GITHUB_SHA" \
              --title "Moziik $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
          echo "Lien permanent : https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/moziik.apk" >> "$GITHUB_STEP_SUMMARY"
